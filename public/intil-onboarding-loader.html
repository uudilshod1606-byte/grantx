<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>INTIL — Onboarding</title>
</head>
<body style="margin:0">
<script>
(async()=>{
  // Keep the premium HTML completely same-origin. The previous version
  // fetched from raw.githubusercontent.com, which can fail inside Lovable's
  // preview because of browser/network restrictions.
  const asset = '/intil-onboarding-v5-premium.html.gz';
  const r = await fetch(asset, { cache:'no-store' });
  if(!r.ok) throw new Error('Onboarding asset failed: '+r.status);
  if(!r.body) throw new Error('Onboarding asset body unavailable');
  const ds = new DecompressionStream('gzip');
  const stream = r.body.pipeThrough(ds);
  const html = await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
})().catch(e=>{
  console.error('INTIL onboarding:', e);
  document.body.innerHTML='<pre style="font:14px monospace;padding:24px">INTIL onboarding yuklanmadi. '+e.message+'</pre>';
});
</script>
</body>
</html>
