name: apply-open-group-image-fix

on:
  push:
    branches:
      - feature/fix-open-question-shared-images

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply shared open-question image fix
        run: |
          python - <<'PY'
          from pathlib import Path

          pdf = Path("src/components/admin/PdfImportDialog.tsx")
          s = pdf.read_text()

          old = '''    let questionNumber = 0;\n    let lastPart: "a" | "b" | null = null;\n\n    return items.map((q, i) => {'''
          new = '''    let questionNumber = 0;\n    let lastPart: "a" | "b" | null = null;\n    const seenImageSignatures = new Set<string>();\n\n    return items.map((q, i) => {'''
          if old not in s:
              raise SystemExit("PdfImportDialog: buildRows anchor not found")
          s = s.replace(old, new, 1)

          old = '''      const id = `${fileName}-${i}`;\n      const imageUrl = q.rasm_bor ? cropUrls[id] ?? "" : "";\n      const imageMissing = q.rasm_bor && !imageUrl;'''
          new = '''      const id = `${fileName}-${i}`;\n      const imageSignature = q.rasm_bor && q.sahifa != null && q.rasm_x != null && q.rasm_y != null && q.rasm_kengligi != null && q.rasm_balandligi != null\n        ? [q.sahifa, q.rasm_x, q.rasm_y, q.rasm_kengligi, q.rasm_balandligi].map((v) => Math.round(Number(v) * 2) / 2).join(":")\n        : "";\n      const isSharedImageDuplicate = Boolean(imageSignature && seenImageSignatures.has(imageSignature));\n      if (imageSignature && !isSharedImageDuplicate) seenImageSignatures.add(imageSignature);\n      const imageUrl = q.rasm_bor && !isSharedImageDuplicate ? cropUrls[id] ?? "" : "";\n      const imageMissing = q.rasm_bor && !isSharedImageDuplicate && !imageUrl;'''
          if old not in s:
              raise SystemExit("PdfImportDialog: image assignment anchor not found")
          s = s.replace(old, new, 1)

          old = '''            const requests = items\n              .map((q, i) => ({ q, key: `${file.name}-${i}` }))\n              .filter(({ q }) => q.rasm_bor && q.sahifa != null && q.rasm_x != null && q.rasm_y != null && q.rasm_kengligi != null && q.rasm_balandligi != null && q.rasm_kengligi > 3 && q.rasm_balandligi > 3 && !(q.rasm_kengligi >= 97 && q.rasm_balandligi >= 97))\n              .map(({ q, key }) => ({ key, page: q.sahifa as number, x: q.rasm_x as number, y: q.rasm_y as number, width: q.rasm_kengligi as number, height: q.rasm_balandligi as number }));'''
          new = '''            const seenCropSignatures = new Set<string>();\n            const requests = items\n              .map((q, i) => ({ q, key: `${file.name}-${i}` }))\n              .filter(({ q }) => q.rasm_bor && q.sahifa != null && q.rasm_x != null && q.rasm_y != null && q.rasm_kengligi != null && q.rasm_balandligi != null && q.rasm_kengligi > 3 && q.rasm_balandligi > 3 && !(q.rasm_kengligi >= 97 && q.rasm_balandligi >= 97))\n              .filter(({ q }) => {\n                const signature = [q.sahifa, q.rasm_x, q.rasm_y, q.rasm_kengligi, q.rasm_balandligi].map((v) => Math.round(Number(v) * 2) / 2).join(":");\n                if (seenCropSignatures.has(signature)) return false;\n                seenCropSignatures.add(signature);\n                return true;\n              })\n              .map(({ q, key }) => ({ key, page: q.sahifa as number, x: q.rasm_x as number, y: q.rasm_y as number, width: q.rasm_kengligi as number, height: q.rasm_balandligi as number }));'''
          if old not in s:
              raise SystemExit("PdfImportDialog: crop request anchor not found")
          s = s.replace(old, new, 1)
          pdf.write_text(s)

          blue = Path("src/components/bluebook/BluebookExam.tsx")
          s = blue.read_text()
          start = s.index("function OpenGroup({")
          end = s.index("/**\n * Open-question answer input", start)
          new_fn = '''function OpenGroup({\n  group,\n  answers,\n  onChangeText,\n}: {\n  group: Question[];\n  answers: Record<string, AnswerValue>;\n  onChangeText: (questionId: string, v: string) => void;\n}) {\n  const sharedIntro = group[0]?.groupIntro?.trim() ?? "";\n  const sharedImage = group.find((q) => q.imageUrl)?.imageUrl;\n\n  return (\n    <div className="space-y-8">\n      {sharedIntro && (\n        <div className="text-[16px] leading-relaxed text-black"><MathContent latex={sharedIntro} /></div>\n      )}\n      {sharedImage && (\n        <img\n          src={sharedImage}\n          alt="Savol rasmi"\n          className="max-h-72 rounded border border-gray-300"\n        />\n      )}\n      {group.map((q, i) => {\n        const a = answers[q.id];\n        const partLabel = `${PART_LABELS[i] ?? String.fromCharCode(97 + i)})`;\n        return (\n          <div key={q.id} className={i > 0 ? "border-t border-gray-200 pt-6" : ""}>\n            <div className="mb-2 text-base font-bold text-black">{partLabel}</div>\n            <div className="text-[16px] leading-relaxed text-black"><MathContent latex={q.text} /></div>\n            <OpenAnswerField value={a?.kind === "text" ? a.value : ""} onChange={(v) => onChangeText(q.id, v)} label={`Javob: ${partLabel}`} placeholder={`${partLabel} javob...`} />\n          </div>\n        );\n      })}\n    </div>\n  );\n}\n\n'''
          s = s[:start] + new_fn + s[end:]
          blue.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/PdfImportDialog.tsx src/components/bluebook/BluebookExam.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: render shared open-question images once"
            git push
          fi
