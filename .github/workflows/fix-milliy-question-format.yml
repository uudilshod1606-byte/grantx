name: Repair Milliy Sertifikat question format

on:
  push:
    paths:
      - ".github/workflows/fix-milliy-question-format.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected source block not found in {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 1) Excel import: preserve real Excel dates as DD.MM.YYYY and make
          #    open-question type detection tolerant of labels such as
          #    "ochiq savol", "ochiq a/b", "ochiq-qism", etc.
          replace_once(
              "src/components/admin/BulkImportDialog.tsx",
              '''const SAVOL_TURI_MAP: Record<string, QuestionType> = {\n  yopiq: "yopiq",\n  moslashtirish: "moslashtirish",\n  ochiq: "ochiq",\n  ochiq_bitta: "ochiq",\n  ochiq_qism: "ochiq",\n  yozma: "ochiq",\n  esse: "esse",\n};''',
              '''const SAVOL_TURI_MAP: Record<string, QuestionType> = {\n  yopiq: "yopiq",\n  yopiq_bitta: "yopiq",\n  moslashtirish: "moslashtirish",\n  moslashtir: "moslashtirish",\n  ochiq: "ochiq",\n  ochiq_bitta: "ochiq",\n  ochiq_qism: "ochiq",\n  ochiq_ab: "ochiq",\n  ochiq_a_b: "ochiq",\n  yozma: "ochiq",\n  esse: "esse",\n};\n\nfunction normalizeExamLabelValue(value: unknown) {\n  if (value === null || value === undefined || value === "") return "";\n  if (typeof value === "number" && Number.isFinite(value)) {\n    const parsed = XLSX.SSF.parse_date_code(value);\n    if (parsed) {\n      return `${String(parsed.d).padStart(2, "0")}.${String(parsed.m).padStart(2, "0")}.${String(parsed.y)}`;\n    }\n  }\n  const raw = String(value).trim();\n  const match = raw.match(/^(\\d{4})[-/.](\\d{1,2})[-/.](\\d{1,2})$/);\n  if (match) return `${match[3].padStart(2, "0")}.${match[2].padStart(2, "0")}.${match[1]}`;\n  return raw;\n}'''
          )

          replace_once(
              "src/components/admin/BulkImportDialog.tsx",
              '''        const get = (col: string) => {\n          const key = Object.keys(src).find((k) => k.trim().toLowerCase() === col);\n          return norm(key ? src[key] : "");\n        };''',
              '''        const get = (col: string) => {\n          const key = Object.keys(src).find((k) => k.trim().toLowerCase() === col);\n          const value = key ? src[key] : "";\n          return col === "imtihon_sanasi" ? normalizeExamLabelValue(value) : norm(value);\n        };'''
          )

          replace_once(
              "src/components/admin/BulkImportDialog.tsx",
              '''        const savolTuriRaw = get("savol_turi").toLowerCase().replace(/\\s+/g, "_");\n        const explicitType = SAVOL_TURI_MAP[savolTuriRaw];''',
              '''        const savolTuriRaw = get("savol_turi")\n          .toLowerCase()\n          .trim()\n          .replace(/[()]/g, "")\n          .replace(/[\\s-]+/g, "_");\n        const explicitType =\n          SAVOL_TURI_MAP[savolTuriRaw] ??\n          (savolTuriRaw.includes("ochiq") || savolTuriRaw.includes("yozma")\n            ? "ochiq"\n            : savolTuriRaw.includes("moslasht")\n              ? "moslashtirish"\n              : savolTuriRaw.includes("esse")\n                ? "esse"\n                : undefined);'''
          )

          # 2) Group rows by groupId even if an Excel import/order has another
          #    row between two parts of the same logical question.
          replace_once(
              "src/lib/domain.ts",
              '''export function buildQuestionSlots(questions: Question[]): Question[][] {\n  const slots: Question[][] = [];\n  let i = 0;\n  while (i < questions.length) {\n    const q = questions[i];\n    if (q.groupId) {\n      const group = [q];\n      let j = i + 1;\n      while (j < questions.length && questions[j].groupId === q.groupId) {\n        group.push(questions[j]);\n        j++;\n      }\n      slots.push(group);\n      i = j;\n    } else {\n      slots.push([q]);\n      i++;\n    }\n  }\n  return slots;\n}''',
              '''export function buildQuestionSlots(questions: Question[]): Question[][] {\n  const slots: Question[][] = [];\n  const grouped = new Map<string, Question[]>();\n  const emitted = new Set<string>();\n\n  for (const q of questions) {\n    if (!q.groupId) {\n      slots.push([q]);\n      continue;\n    }\n\n    const group = grouped.get(q.groupId) ?? [];\n    group.push(q);\n    grouped.set(q.groupId, group);\n  }\n\n  for (const q of questions) {\n    if (!q.groupId) continue;\n    if (emitted.has(q.groupId)) continue;\n    emitted.add(q.groupId);\n    slots.push(grouped.get(q.groupId) ?? [q]);\n  }\n\n  return slots;\n}'''
          )

          # 3) Render National Certificate open A/B parts as actual a)/b)
          #    parts, with the shared stem shown once when supplied.
          replace_once(
              "src/components/bluebook/BluebookExam.tsx",
              '''  return (\n    <div className="space-y-8">\n      {group.map((q, i) => {\n        const a = answers[q.id];\n        return (\n          <div key={q.id} className={i > 0 ? "border-t border-gray-200 pt-6" : ""}>\n            <div className="mb-2 text-xs font-bold uppercase tracking-wide text-gray-500">\n              {PART_LABELS[i] ?? i + 1}) qism\n            </div>\n            <div className="text-[16px] leading-relaxed text-black">\n              <MathContent latex={q.text} />\n            </div>''',
              '''  return (\n    <div className="space-y-8">\n      {group.map((q, i) => {\n        const a = answers[q.id];\n        const partLabel = `${PART_LABELS[i] ?? String.fromCharCode(97 + i)})`;\n        const sharedIntro = i === 0 ? q.groupIntro?.trim() : "";\n        const showSharedIntro = !!sharedIntro && sharedIntro !== q.text.trim();\n        return (\n          <div key={q.id} className={i > 0 ? "border-t border-gray-200 pt-6" : ""}>\n            {showSharedIntro && (\n              <div className="mb-5 text-[16px] leading-relaxed text-black">\n                <MathContent latex={sharedIntro!} />\n              </div>\n            )}\n            <div className="mb-2 text-base font-bold text-black">\n              {partLabel}\n            </div>\n            <div className="text-[16px] leading-relaxed text-black">\n              <MathContent latex={q.text} />\n            </div>'''
          )

          p = Path("src/components/bluebook/BluebookExam.tsx")
          text = p.read_text(encoding="utf-8")
          text = text.replace('''              <input\n                type="text"\n                value={a?.kind === "text" ? a.value : ""}\n                onChange={(e) => onChangeText(q.id, e.target.value)}\n                placeholder="Javob..."''', '''              <input\n                type="text"\n                value={a?.kind === "text" ? a.value : ""}\n                onChange={(e) => onChangeText(q.id, e.target.value)}\n                placeholder={`${partLabel} javob...`}
''', 1)
          p.write_text(text, encoding="utf-8")

          # Mark this repair so reruns are harmless.
          Path(".github/workflows/fix-milliy-question-format.yml").unlink()

      - name: Install dependencies and build
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/BulkImportDialog.tsx src/lib/domain.ts src/components/bluebook/BluebookExam.tsx .github/workflows/fix-milliy-question-format.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: render Milliy Sertifikat questions correctly"
          git push
