name: Finish written-work admin navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch admin navigation and clean temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/routes/admin.tsx")
          text = path.read_text(encoding="utf-8")

          if 'TabsTrigger value="written"' in text:
              print("Written admin tab already exists; cleaning temporary workflows.")
          else:
              tabs_pattern = re.compile(
                  r'(?m)^\s*<TabsTrigger value="overview">.*\n'
                  r'\s*<TabsTrigger value="questions">.*\n'
                  r'\s*<TabsTrigger value="exams">.*\n'
                  r'\s*<TabsTrigger value="users">.*$'
              )
              tabs_replacement = '''              <TabsTrigger value="overview"><LayoutDashboard className="mr-2 h-4 w-4" /> Umumiy</TabsTrigger>
              <TabsTrigger value="questions"><FileQuestion className="mr-2 h-4 w-4" /> Savollar</TabsTrigger>
              <TabsTrigger value="exams"><ClipboardList className="mr-2 h-4 w-4" /> Imtihonlar</TabsTrigger>
              <TabsTrigger value="users"><Users className="mr-2 h-4 w-4" /> Foydalanuvchilar</TabsTrigger>
              <TabsTrigger value="written"><Pencil className="mr-2 h-4 w-4" /> Yozma ishlar</TabsTrigger>'''

              if not tabs_pattern.search(text):
                  raise SystemExit("admin.tsx tabs block not found")
              text = tabs_pattern.sub(tabs_replacement, text, count=1)

              content_pattern = re.compile(
                  r'(?m)^\s*<TabsContent value="overview"><Overview /></TabsContent>\n'
                  r'\s*<TabsContent value="questions"><QuestionsTab /></TabsContent>\n'
                  r'\s*<TabsContent value="exams"><ExamsTab /></TabsContent>\n'
                  r'\s*<TabsContent value="users"><UsersTab /></TabsContent>$'
              )
              content_replacement = '''            <TabsContent value="overview"><Overview /></TabsContent>
            <TabsContent value="questions"><QuestionsTab /></TabsContent>
            <TabsContent value="exams"><ExamsTab /></TabsContent>
            <TabsContent value="users"><UsersTab /></TabsContent>
            <TabsContent value="written">
              <div className="glass rounded-2xl p-6 animate-fade-up">
                <h2 className="text-lg font-semibold">Yozma ishlarni tekshirish</h2>
                <p className="mt-2 text-sm text-muted-foreground">
                  Ona tili esse va Kimyo/Biologiya yozma javoblarini ko'rish, AI taklifini olish,
                  ballarni tahrirlash va tasdiqlash uchun maxsus tekshiruv sahifasini oching.
                </p>
                <Button asChild className="gradient-bg mt-5 text-primary-foreground">
                  <Link to="/admin/yozma-ishlar">Yozma ishlarni ochish</Link>
                </Button>
              </div>
            </TabsContent>'''

              if not content_pattern.search(text):
                  raise SystemExit("admin.tsx content block not found")
              text = content_pattern.sub(content_replacement, text, count=1)
              path.write_text(text, encoding="utf-8")

          Path(".github/workflows/_apply-open-group-image-fix.yml").unlink(missing_ok=True)
          Path(".github/workflows/_finish-written-admin-nav.yml").unlink(missing_ok=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: add written-work admin navigation"
          git push